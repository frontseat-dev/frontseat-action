name: Frontseat
description: >-
  Run frontseat on a runner: check the repository out, ready the runner for
  the grid frontseat.yaml names, verify, and publish when the workflow says
  this run releases.
author: frontseat-dev
branding:
  icon: layers
  color: orange

# The workflow that calls this is generated: frontseat's github plugin renders
# it from frontseat.yaml and keeps what is the workspace's own, the triggers
# and whether a run releases. Everything else happens here.
#
# frontseat runs on the grid frontseat.yaml names. Without one it runs the
# embedded grid on the runner, which needs the disk and keeps the store this
# action caches; with one, the runner only stages and fetches. Effects, the
# publishes among them, always run on an embedded grid of their own, so the
# sandbox is readied either way.

inputs:
  release:
    description: Whether this run publishes after it verifies.
    required: false
    default: "false"
  github-token:
    description: >-
      The token tools are installed with from GitHub releases, and a publish
      uses for the forge and GitHub's registry.
    required: false
    default: ${{ github.token }}
  working-directory:
    description: Directory holding frontseat.yaml and mise.toml.
    required: false
    default: "."
  free-disk:
    description: >-
      Remove toolchains GitHub's images preinstall and frontseat never uses,
      when frontseat.yaml names no grid. The embedded grid refuses to start an action with less than 8 GiB free, and a
      stock ubuntu-latest runner leaves about 14 GiB before any build. Turn it
      off on a self-hosted runner.
    required: false
    default: "true"
  cache:
    description: >-
      Restore and save the workspace's memos, frontseat's plugins and their
      compiled wasm, and the embedded grid's store when frontseat.yaml names
      no grid, and mise's tools. A runner that sets FRONTSEAT_STATE_DIR keeps
      the memos, plugins and tools on volumes of its own, and the action
      leaves them to it.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # The tags and history a release reads come with the checkout.
    - name: Check out
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # A runner whose caches live on volumes it keeps from job to job sets
    # FRONTSEAT_STATE_DIR in its environment, where frontseat keeps the
    # workspace's memos, beside the user cache that holds the plugins, and
    # keeps mise's tools on a volume too. Its volumes already hold what the
    # cache steps would restore, the toolchain among them, so they are
    # skipped. The variable is the runner's, not the workflow's, so it is
    # read from the shell: the env context sees only what YAML set.
    - name: Read where the runner keeps state
      id: runner
      shell: bash
      run: |
        if [ -n "${FRONTSEAT_STATE_DIR:-}" ]; then
          echo "volumes=true" >> "$GITHUB_OUTPUT"
          echo "state: $FRONTSEAT_STATE_DIR, kept by the runner"
        else
          echo "volumes=false" >> "$GITHUB_OUTPUT"
          echo "state: in the checkout, cached by the action"
        fi

    # The mise the repository names with min_version, in the first of its
    # root configs that sets one, as min_version = "x.y.z" or a table's
    # hard version: mise-action installs whatever mise is newest unless it
    # is handed a version, and mise is not on the runner yet to read the
    # config itself. Only the top level is read, up to the first table.
    - name: Read the mise version
      id: mise
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        version=""
        found=""
        for f in mise.toml .mise.toml mise/config.toml .mise/config.toml .config/mise.toml .config/mise/config.toml .config/mise/mise.toml; do
          [ -f "$f" ] || continue
          value=$(sed -n -e '/^[[:space:]]*\[/q' -e 's/^[[:space:]]*min_version[[:space:]]*=[[:space:]]*//p' "$f" | head -n 1)
          [ -n "$value" ] || continue
          found=$f
          case "$value" in
            "{"*) value=$(printf '%s\n' "$value" | sed -n "s/.*hard[[:space:]]*=[[:space:]]*[\"']\([^\"']*\)[\"'].*/\1/p") ;;
            *) value=$(printf '%s\n' "$value" | sed -n "s/^[\"']\([^\"']*\)[\"'].*/\1/p") ;;
          esac
          if printf '%s\n' "$value" | grep -Eq '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$'; then
            version=$value
            echo "mise $version, the min_version of $f"
          else
            echo "::warning file=$f::min_version names no exact mise version (${value:-none}); installing the newest mise"
          fi
          break
        done
        if [ -z "$found" ]; then
          echo "::warning::mise.toml names no min_version; installing the newest mise. Add min_version = \"x.y.z\" to pin it."
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # The repository's mise.toml names every tool, frontseat included; a
    # checkout of frontseat builds its own through mise's postinstall hook.
    - name: Install the toolchain
      uses: jdx/mise-action@v2
      with:
        version: ${{ steps.mise.outputs.version }}
        working_directory: ${{ inputs.working-directory }}
        github_token: ${{ inputs.github-token }}
        cache: ${{ inputs.cache == 'true' && steps.runner.outputs.volumes != 'true' }}
      # A tool pinned from GitHub releases, frontseat's own among them, is
      # fetched with the job's token: a private repository's releases need
      # it, and a public one's are not rate-limited with it.
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}

    # The grid frontseat.yaml selects, as frontseat selects it: grid's
    # address, else the one of grids FRONTSEAT_GRID names, else the one
    # marked default, else the only one. No address is the embedded grid.
    # frontseat.yaml is read with yq, run through mise at a pinned version,
    # so the runner needs nothing but mise.
    - name: Read the grid
      id: grid
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        yq() { mise exec aqua:mikefarah/yq@4.54.1 -- yq "$@" frontseat.yaml; }
        address=$(yq '.grid.address // ""')
        name=""
        if [ -z "$address" ]; then
          name=${FRONTSEAT_GRID:-}
          [ -n "$name" ] || name=$(yq '(.grids // {}) | to_entries | map(select(.value.default == true)) | .[0].key // ""')
          [ -n "$name" ] || [ "$(yq '(.grids // {}) | length')" != 1 ] || name=$(yq '.grids | keys | .[0]')
          if [ -n "$name" ]; then
            address=$(NAME=$name yq '.grids[strenv(NAME)].address // ""')
            if [ -z "$address" ]; then
              echo "::error title=No such grid::the run selects the grid $name, which frontseat.yaml does not name under grids with an address."
              exit 1
            fi
          fi
        fi
        echo "address=$address" >> "$GITHUB_OUTPUT"
        echo "grid: ${name:+$name at }${address:-embedded}"

    - name: Free disk
      if: inputs.free-disk == 'true' && runner.os == 'Linux' && steps.grid.outputs.address == ''
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
          /opt/hostedtoolcache /usr/share/swift /usr/lib/jvm /usr/share/miniconda \
          /usr/local/julia* /usr/local/share/powershell /usr/local/share/chromium \
          /usr/local/lib/node_modules
        sudo docker image prune --all --force >/dev/null 2>&1 || true
        df -h /

    # The embedded grid confines every action under bubblewrap. A runner
    # that has it is ready as it is. GitHub's Ubuntu images do not ship it,
    # and their AppArmor policy denies the unprivileged user namespaces it
    # needs, so where apt can install it the action does both. Anywhere
    # else the runner's image must carry it.
    - name: Ready the sandbox
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # A sandbox is ready when bubblewrap can make the namespaces frontseat
        # confines an action in, network included; being installed is not
        # enough (Ubuntu ships bwrap but restricts unprivileged user
        # namespaces through AppArmor).
        works() { command -v bwrap >/dev/null && bwrap --ro-bind / / --unshare-all --die-with-parent true 2>/dev/null; }
        if works; then
          echo "sandbox: $(bwrap --version)"
          exit 0
        fi
        if command -v apt-get >/dev/null && command -v sudo >/dev/null; then
          command -v bwrap >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap; }
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        if works; then
          echo "sandbox: $(bwrap --version)"
        else
          echo "::error title=No sandbox::frontseat confines every action under bubblewrap, and bubblewrap cannot make its namespaces on this runner. Put a working bubblewrap in the runner's image, with unprivileged user namespaces allowed."
          exit 1
        fi

    - name: Restore the embedded grid's store
      id: store
      if: inputs.cache == 'true' && steps.grid.outputs.address == ''
      uses: actions/cache/restore@v4
      with:
        path: ~/.frontseat
        key: frontseat-store-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: frontseat-store-${{ runner.os }}-${{ runner.arch }}-

    # The memos are named by the grid they were made against.
    - name: Restore the workspace's memos
      id: memos
      if: inputs.cache == 'true' && steps.runner.outputs.volumes != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ inputs.working-directory }}/.frontseat/memo
          ${{ inputs.working-directory }}/.frontseat/fingerprints
        key: frontseat-memo-${{ runner.os }}-${{ runner.arch }}-${{ steps.grid.outputs.address }}-${{ github.sha }}
        restore-keys: frontseat-memo-${{ runner.os }}-${{ runner.arch }}-${{ steps.grid.outputs.address }}-

    # The plugins frontseat.lock pins and their compiled wasm, by the lock
    # and the frontseat mise.toml pins. A plugin is loaded only when its
    # sha256 is the lock's, so a restored one is never trusted unread. No
    # fallback key: the compiled wasm is never pruned, and a cache carried
    # from pin to pin would only grow.
    - name: Restore frontseat's plugins
      id: plugins
      if: inputs.cache == 'true' && steps.runner.outputs.volumes != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cache/frontseat/plugins
          ~/.cache/frontseat/wasm
        key: frontseat-plugins-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/frontseat.lock', inputs.working-directory), format('{0}/mise.toml', inputs.working-directory)) }}

    # frontseat fetches the plugins frontseat.lock pins from their
    # releases, which for a private repository needs the token.
    - name: Verify
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: mise exec -- frontseat verify --plain

    # A publish pushes images and charts as its tools do, with the
    # credentials of the Docker config: gib and crossplane read it, and helm
    # falls back to it. A run that releases logs in to GitHub's registry
    # with the token, in a config of the job's own beside what the runner's
    # already holds, so it lasts only as long as the job. The workflow grants
    # the token packages: write.
    - name: Log in to GitHub's registry
      if: inputs.release == 'true'
      shell: bash
      env:
        ACTOR: ${{ github.actor }}
        TOKEN: ${{ inputs.github-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        auth=$(printf '%s:%s' "$ACTOR" "$TOKEN" | base64 | tr -d '\n')
        echo "::add-mask::$auth"
        dir=$RUNNER_TEMP/frontseat-docker
        mkdir -p "$dir"
        from=${DOCKER_CONFIG:-$HOME/.docker}/config.json
        if [ -s "$from" ]; then cp "$from" "$dir/config.json"; else echo '{}' > "$dir/config.json"; fi
        chmod 600 "$dir/config.json"
        AUTH=$auth mise exec aqua:mikefarah/yq@4.54.1 -- yq -i -o json '.auths["ghcr.io"].auth = strenv(AUTH)' "$dir/config.json"
        echo "DOCKER_CONFIG=$dir" >> "$GITHUB_ENV"
        echo "logged in to ghcr.io as $ACTOR"

    - name: Publish
      if: inputs.release == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: mise exec -- frontseat publish --plain

    # Saved after the run, whether it passed or not: what the store and the
    # memos hold is checked when it is read, so a failed run's is as good to
    # start from. A key the restore already found is left as it is.
    - name: Save the embedded grid's store
      if: ${{ !cancelled() && steps.store.outcome == 'success' && steps.store.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ~/.frontseat
        key: ${{ steps.store.outputs.cache-primary-key }}

    - name: Save the workspace's memos
      if: ${{ !cancelled() && steps.memos.outcome == 'success' && steps.memos.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ inputs.working-directory }}/.frontseat/memo
          ${{ inputs.working-directory }}/.frontseat/fingerprints
        key: ${{ steps.memos.outputs.cache-primary-key }}

    - name: Save frontseat's plugins
      if: ${{ !cancelled() && steps.plugins.outcome == 'success' && steps.plugins.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cache/frontseat/plugins
          ~/.cache/frontseat/wasm
        key: ${{ steps.plugins.outputs.cache-primary-key }}
